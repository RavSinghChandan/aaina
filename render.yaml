# Render Blueprint: New > Blueprint > pick this repo (render.yaml at the root). Free web service.
services:
  - type: web
    name: aaina-api
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DEEPSEEK_API_KEY
        sync: false            # your DeepSeek key
      - key: AAINA_LLM
        value: deepseek
      - key: DATABASE_URL       # a free Neon Postgres URL. Without it the free instance uses SQLite,
        sync: false             # which is wiped whenever the server sleeps, restarts or redeploys.
      - key: ALLOWED_ORIGINS
        value: https://aaina-ai.vercel.app,https://aaina-eight.vercel.app
      - key: ADMIN_KEY
        generateValue: true
      - key: ADMIN_KEYS         # one admin key per teammate: name:key,name2:key2 (remove one to revoke it)
        sync: false
      # Sign-in: visitors need an access code before the AI runs (protects the DeepSeek key).
      - key: AAINA_ENV
        value: production        # with no code set, consultations stay locked (fail closed)
      - key: AAINA_SECRET
        generateValue: true      # signs the login tokens
      - key: AAINA_ACCESS_CODE
        sync: false              # the code you share; several codes allowed, comma separated
