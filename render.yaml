# Render Blueprint: New > Blueprint > pick this repo (render.yaml at the root). Free web service.
services:
  - type: web
    name: aaina-api
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DEEPSEEK_API_KEY
        sync: false            # your DeepSeek key
      - key: AAINA_LLM
        value: deepseek
      - key: DATABASE_URL
        sync: false            # paste your Neon / Supabase Postgres URL
      - key: ALLOWED_ORIGINS
        value: https://aaina.vercel.app
      - key: ADMIN_KEY
        generateValue: true
