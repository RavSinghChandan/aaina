# Render Blueprint: New > Blueprint > pick this repo (render.yaml at the root). Free web service.
services:
  - type: web
    name: aaina-api
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: DEEPSEEK_API_KEY
        sync: false            # your DeepSeek key
      - key: AAINA_LLM
        value: deepseek
      # DATABASE_URL is optional: without it the free instance uses SQLite (resets on redeploy).
      # For lasting data add a free Neon / Supabase Postgres URL here later.
      - key: ALLOWED_ORIGINS
        value: https://aaina-ai.vercel.app,https://aaina-eight.vercel.app
      - key: ADMIN_KEY
        generateValue: true
