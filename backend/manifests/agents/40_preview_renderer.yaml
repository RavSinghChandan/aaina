id: preview_renderer
title: Style previews
description: Puts each of the three recommended cuts on the customer's own photo (local inpainting model repaints only the hair). Without a photo or the local model, draws an illustrated card instead.
kind: image
inputs: [recommendation, analysis]
prompt: |
  RAW photo portrait, {{ input.gender }} haircut: {{ option.name }}, {{ style.look }}, {{ input.photo_measure.hair_color }} hair, natural hairline, realistic detailed hair strands, soft natural light, sharp focus, photorealistic
output_schema:
  type: object
  properties:
    previews:
      type: array
      items:
        type: object
        properties:
          style_id: { type: string }
          kind: { type: string, enum: [photo, drawing] }
          image: { type: string }
          caption: { type: string }
ui: { view: previews, hidden: true, order: 25 }
offline: { rule: style_previews }
